[package]
name = "diskcleanup"
version = "0.1.0"
description = "跨平台磁盘分析与清理工具（macOS / Windows）"
license = "MIT"
edition = "2021"

[lib]
name = "diskcleanup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri-plugin-dialog = "2"
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
trash = "5"
sysinfo = "0.32"
sha2 = "0.10"
dirs = "5"

[profile.release]
strip = true
lto = true
codegen-units = 1

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_UI_Shell", "Win32_System_Com", "Win32_Storage_FileSystem"] }
