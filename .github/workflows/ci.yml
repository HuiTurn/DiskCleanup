name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 前端功能验证：在三大桌面系统上跑单测并验证可构建
  frontend:
    name: Frontend test & build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run frontend unit tests
        run: npm test
      - name: Build frontend (tsc + vite)
        run: npm run build

  # Rust 引擎单测：三平台分别编译运行，验证平台适配层（macos.rs / windows.rs）
  engine:
    name: Rust engine tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Tauri prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Run engine unit tests
        run: cargo test --lib

  # 自动截图：在 mock 模式下渲染各界面并存为 artifact
  screenshots:
    name: Capture UI screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Capture screenshots (mock mode)
        run: node scripts/screenshot.mjs
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: docs/screenshots/
          if-no-files-found: error
